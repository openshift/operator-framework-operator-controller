version: 2
updates:
  - package-ecosystem: gomod
    directories:
      - /openshift
      - /openshift/default-catalog-consistency
      - /openshift/tests-extension
      - /openshift/tools
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: "UPSTREAM: <carry>:"
    vendor: true
